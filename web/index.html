<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<title>agent-rooms</title>
<style>
  :root {
    --surface-0: #f3f2ef; --surface-1: #fcfcfb; --line: #e3e2dd;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #6b6a65;
    --accent: #1d63b8; --accent-fill: #1d63b8; --accent-ink: #ffffff; --accent-soft: #e6f0fb;
    --good: #0a7a0a; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --critical-text: #b52f2f;
    --critical-soft: #fbeaea; --track: #ecebe7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-0: #121211; --surface-1: #1a1a19; --line: #2e2e2c;
      --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #9a9992;
      --accent: #6aa6f2; --accent-fill: #2c6fcb; --good: #0ca30c; --critical-text: #ef6a6a; --accent-soft: #1d2a3a; --critical-soft: #3a1f1f; --track: #2a2a28;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface-0); color: var(--text-primary);
         font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  body, main { overflow-anchor: none; }   /* we restore the scroll position ourselves, the same on every browser */
  main { max-width: 640px; margin: 0 auto; padding: 12px 12px 48px; }
  header { padding: 8px 4px 4px; }
  h1 { font-size: 20px; line-height: 1.25; margin: 0; overflow-wrap: anywhere; }
  .phase { color: var(--text-secondary); margin: 2px 0 10px; }
  .rooms { display: none; gap: 6px; overflow-x: auto; margin: 0 -12px 10px; padding: 2px 12px;
           scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .rooms::-webkit-scrollbar { display: none; }
  @media (min-width: 700px) { main { max-width: 880px; } .rooms { display: flex; flex-wrap: wrap; overflow-x: visible; margin: 0 0 10px; padding: 2px 0; } .roombtn { display: none !important; } }
  .roombtn { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 48px; margin: 0 0 4px; border: 1px solid var(--line); background: var(--surface-1);
             color: var(--text-primary); border-radius: 14px; padding: 6px 12px; font: inherit; text-align: left; cursor: pointer; }
  .roombtn .nm { flex: 1; min-width: 0; }
  .roombtn .nm b { display: block; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .roombtn .nm small { display: block; font-size: 12px; color: var(--text-muted); }
  .n { flex: none; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; font-size: 12px; font-weight: 700;
       display: inline-grid; place-items: center; background: var(--critical); color: #fff; }
  .n.paused, .rooms button[aria-pressed="true"] .n.paused { background: none; color: var(--text-muted); border: 1px solid var(--line); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--track); border-radius: 12px; padding: 3px; margin: 12px 0 8px; }
  .seg button { border: 0; background: none; color: var(--text-secondary); border-radius: 9px; padding: 8px; font: inherit; font-size: 14px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--surface-1); color: var(--text-primary); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .roomrow { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; border: 0; border-bottom: 1px solid var(--line); background: none;
             color: var(--text-primary); padding: 8px 4px; font: inherit; text-align: left; cursor: pointer; }
  .roomrow .nm { flex: 1; min-width: 0; }
  .roomrow .nm b { display: block; font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .roomrow .nm small { display: block; font-size: 13px; color: var(--text-secondary); }
  .roomrow[aria-current="true"] .nm b { color: var(--accent); }
  .roomrow .nm small.stalled { color: var(--critical-text); }
  .palbtn { flex: none; width: 48px; min-height: 48px; margin: 0 0 4px; border: 1px solid var(--line); background: var(--surface-1); color: var(--text-primary); border-radius: 14px; font-size: 18px; cursor: pointer; }
  .rowtop { display: flex; gap: 6px; align-items: stretch; } .rowtop .roombtn { flex: 1; min-width: 0; width: auto; }
  .palkey { display: none; }
  @media (min-width: 700px) { .rowtop { display: block; } .palbtn { display: none; } .palkey { display: block; margin: 0 0 6px; text-align: right; font-size: 12px; color: var(--text-muted); }
    .palkey button { border: 0; background: none; color: inherit; font: inherit; cursor: pointer; text-decoration: underline dotted; padding: 2px 0; min-height: 44px; } }
  .pal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; display: flex; align-items: flex-start; justify-content: center; }
  .pal { background: var(--surface-1); color: var(--text-primary); width: 100%; max-width: 620px; max-height: 100vh; display: flex; flex-direction: column; border-radius: 0 0 16px 16px; box-shadow: 0 8px 30px rgba(0,0,0,.3); }
  @media (min-width: 700px) { .pal { margin-top: 8vh; max-height: 78vh; border-radius: 16px; } }
  .pal .in { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .pal .in input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: inherit; font: inherit; font-size: 16px; min-height: 32px; }
  .pal .in button { border: 0; background: var(--track); color: inherit; border-radius: 50%; width: 32px; height: 32px; font-size: 16px; cursor: pointer; flex: none; }
  .pal .chips { display: flex; gap: 6px; padding: 8px 12px 0; overflow-x: auto; scrollbar-width: none; }
  .pal .chips button { flex: none; border: 0; border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 13px; background: var(--track); color: var(--text-secondary); cursor: pointer; }
  .pal .chips button[aria-pressed="true"] { background: var(--text-primary); color: var(--surface-1); }
  .pal .res { overflow-y: auto; padding: 0 6px 6px; flex: 1; }
  .pal h4 { margin: 12px 6px 2px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-secondary); font-weight: 600; display: flex; justify-content: space-between; }
  .pal h4 button { border: 0; background: none; color: var(--accent); font: inherit; text-transform: none; letter-spacing: 0; cursor: pointer; }
  .pal .hit { display: flex; align-items: baseline; gap: 8px; width: 100%; min-height: 44px; padding: 8px 8px; border: 0; border-radius: 10px; background: none; color: inherit; font: inherit; font-size: 14px; text-align: left; cursor: pointer; }
  .pal .hit.sel { background: var(--track); outline: 2px solid var(--accent); outline-offset: -2px; }
  .pal .hit .id { flex: none; font: 600 12px ui-monospace, Menlo, monospace; color: var(--text-secondary); }
  .pal .hit .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pal .hit small { flex: none; font-size: 12px; color: var(--text-muted); max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pal mark { background: color-mix(in srgb, var(--accent) 25%, transparent); color: inherit; border-radius: 2px; }
  .pal .empty { padding: 16px 12px; }
  .pal .foot { display: flex; gap: 14px; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--text-muted); }
  .pin { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; margin: 0 0 8px; border: 1px dashed var(--text-muted); background: var(--track);
         color: var(--text-primary); border-radius: 14px; padding: 6px 12px; font: inherit; text-align: left; cursor: pointer; }
  .pin b { flex: 1; min-width: 0; font-size: 15px; }
  .pin small { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pin .pill { flex: none; font-size: 12px; border-radius: 999px; padding: 2px 8px; background: var(--surface-1); color: var(--text-secondary); white-space: nowrap; }
  .pin .pill.g { color: var(--good); }
  .pin.on { border: 1px solid var(--text-primary); background: var(--text-primary); color: var(--surface-1); }
  .pin.on small { color: inherit; opacity: .75; }
  .pin.on .pill { background: transparent; color: inherit; }
  .counts.four { grid-template-columns: repeat(4, 1fr); }
  .sub2 { color: var(--text-secondary); font-size: 13px; margin: 2px 4px 6px; }
  .newpill { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 20; border: 0;
             background: var(--accent-fill); color: var(--accent-ink); border-radius: 999px; padding: 10px 16px; font: inherit; font-size: 14px; font-weight: 600;
             box-shadow: 0 2px 12px rgba(0,0,0,.3); cursor: pointer; max-width: calc(100vw - 24px); white-space: nowrap; }
  .newpill[hidden] { display: none; }
  .stale { position: sticky; top: 0; z-index: 15; margin: 0; padding: 8px 12px; font-size: 14px; background: var(--surface-1); border-bottom: 1px solid var(--line); color: var(--critical-text); }
  .stale[hidden] { display: none; }
  .t3note { margin: 0; padding: 10px 12px; font-size: 14px; background: var(--critical-soft); border-bottom: 1px solid var(--critical); color: var(--text-primary); }
  .t3note[hidden] { display: none; }
  .t3note b { display: block; font-size: 15px; }
  body.isstale .newpill { top: calc(54px + env(safe-area-inset-top)); }
  .line { min-height: 20px; line-height: 20px; margin: 6px 0 0; font-size: 14px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .line .ico { margin-right: 4px; }
  .leadcmd { margin: 4px 0 8px; font-size: 14px; }
  .leadcmd summary { cursor: pointer; min-height: 36px; display: flex; align-items: center; color: var(--text-secondary, inherit); }
  .leadcmd .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
  .leadcmd input { flex: 1 1 14ch; min-height: 36px; font: inherit; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-1); color: var(--text-primary); }
  .leadcmd code { display: block; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; background: var(--surface-1); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 6px 0; }
  .slot { min-height: 36px; margin: 6px 0 4px; }
  .slotpill { display: flex; align-items: center; width: 100%; min-height: 36px; border: 1px solid var(--line); background: var(--surface-1); color: var(--text-primary);
              border-radius: 12px; padding: 0 12px; font: inherit; font-size: 14px; text-align: left; cursor: pointer; }
  .slotpill .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slotpill .t .ico { margin-right: 6px; }
  .slotpill.paused { font-weight: 600; }
  .slotpill.stalled { border-color: var(--critical); background: var(--critical-soft); font-weight: 600; }
  .slot .banner { margin: 4px 0 0; }
  .line.attn { color: var(--text-secondary); }
  .line.attn.loud { color: var(--critical-text); font-weight: 600; }
  .rooms button { border: 1px solid var(--line); background: var(--surface-1); color: var(--text-secondary);
                  border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; }
  .rooms button { flex: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; max-width: 220px; }
  .rooms button .name { overflow: hidden; text-overflow: ellipsis; }
  .rooms button[aria-pressed="true"] .n { background: var(--accent-ink); color: var(--accent-fill); }
  .ico { width: 14px; height: 14px; flex: none; vertical-align: -2px; }
  .rooms select.settled { flex: none; border: 1px solid var(--line); background: var(--surface-1); color: var(--text-secondary);
                          border-radius: 999px; padding: 6px 10px; font: inherit; font-size: 14px; max-width: 240px; }
  .rooms select.settled.on { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--accent-ink); }
  .rooms button[aria-pressed="true"] { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--accent-ink); }
  .counts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 6px 0 4px; }
  .count { background: var(--surface-1); border: 1px solid var(--line); border-radius: 10px; padding: 6px 4px;
           font-size: 12px; color: var(--text-secondary); text-align: center; white-space: nowrap; }
  .count b { display: block; color: var(--text-primary); font-size: 18px; line-height: 1.2; }
  .count.hot { border-color: var(--critical); }
  h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-secondary);
       margin: 22px 4px 8px; display: flex; justify-content: space-between; }
  .card.urgent { border-color: var(--critical); }
  .card.done { opacity: .75; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .badge { font-size: 12px; border-radius: 6px; padding: 2px 7px; border: 1px solid var(--line); color: var(--text-secondary); }
  .badge { display: inline-flex; align-items: center; gap: 4px; }
  .badge.urgent { background: var(--critical-soft); border-color: var(--critical); color: var(--text-primary); }
  .badge.oneway { border-color: var(--text-secondary); color: var(--text-primary); }
  .title { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
  .title .id { color: var(--text-muted); font-weight: 500; margin-right: 6px; }
  .impact { margin: 6px 0 10px; }
  .impact .label { font-size: 14px; color: var(--text-secondary); margin-bottom: 4px; }
  .impact .label b { color: var(--text-primary); }
  .bar { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .path { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 8px; font-size: 13px; }
  .path .arrow { color: var(--text-muted); }
  .chip { display: inline-flex; gap: 5px; align-items: center; border: 1px solid var(--line); border-left-width: 4px;
          border-radius: 8px; padding: 3px 8px; background: var(--surface-1); font-size: 13px; max-width: 100%; }
  .chip .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; color: var(--text-secondary); }
  .chip .i { font-weight: 600; }
  .s-doing { border-left-color: var(--accent); } .s-review { border-left-color: var(--warning); }
  .s-blocked { border-left-color: var(--critical); } .s-waits { border-left-color: var(--serious); }
  .s-todo { border-left-color: var(--text-muted); } .s-done { border-left-color: var(--good); }
  .chip .flags { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 4px; }
  .flag { border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .flag.unstaffed { border-color: var(--good); color: var(--text-secondary); }
  .flag.loud { border-color: var(--critical); background: var(--critical-soft); color: var(--critical-text); font-weight: 600; }
  .why { font-size: 14px; color: var(--text-secondary); margin: 4px 0 10px; }
  .why summary { cursor: pointer; color: var(--text-muted); }
  .opts { display: grid; gap: 8px; }
  .opt { position: relative; overflow: hidden; display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; min-height: 52px;
         border: 2px solid var(--line); background: var(--surface-1); color: var(--text-primary);
         border-radius: 12px; padding: 10px 12px; font: inherit; cursor: pointer; }
  .opt:active { transform: scale(.99); }
  .opt .k { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
            display: grid; place-items: center; font-weight: 700; }
  .opt .held { display: block; font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .opt.armed, .opt.chosen { border-color: var(--accent-fill); background: var(--accent-fill); color: var(--accent-ink); }
  .opt.armed .k, .opt.chosen .k { background: rgba(0,0,0,.25); color: #fff; }
  .opt.dim { opacity: .4; }
  .opt[disabled] { cursor: default; }
  .opt .drain { position: absolute; left: 0; bottom: 0; height: 4px; width: 100%; background: rgba(255,255,255,.75); animation: drain 5s linear forwards; }
  @keyframes drain { to { width: 0; } }
  .opt .spin { flex: none; margin: 4px 2px 0 auto; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
               border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .opt .spin { animation: none; }
    .opt .drain { animation: none; width: 100%; opacity: .6; }   /* the 5 s confirm window itself is timed in script and unchanged */
    .opt:active { transform: none; }
    html { scroll-behavior: auto; }
  }
  .card.failed { border-color: var(--critical); background: var(--critical-soft); }
  .card.receipt { border-color: var(--good); }
  .card.receipt .title { margin-bottom: 4px; }
  .card.receipt .title .tick { color: var(--good); margin-right: 6px; }
  .card.receipt .pick { font-size: 15px; margin: 0 0 4px; }
  .result button.openrec { font-size: 14px; margin-left: 4px; text-decoration: underline; }

  textarea { width: 100%; margin-top: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 8px;
             font: inherit; font-size: 15px; background: var(--surface-0); color: var(--text-primary); min-height: 44px; }
  .addnote { display: block; margin-top: 12px; border: 0; background: none; color: var(--accent); font: inherit; font-size: 14px; padding: 6px 0; min-height: 44px; cursor: pointer; }
  .meta { font-size: 12px; color: var(--text-muted); margin-top: 8px; display: flex; justify-content: space-between; gap: 8px; }
  .result { margin-top: 8px; font-size: 14px; }
  .divider { text-align: center; font-size: 13px; color: var(--text-muted); margin: 16px 0 10px; }
  .lane { background: var(--surface-1); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
  .lane .who { font-weight: 600; margin-bottom: 6px; display: flex; justify-content: space-between; }
  .lane .who small { color: var(--text-muted); font-weight: 400; }
  .lane .chips { display: flex; flex-direction: column; gap: 5px; }
  .lane .chip .t { max-width: none; white-space: normal; flex: 1; text-align: left; }
  .lane .chip { justify-content: space-between; flex-wrap: wrap; }
  .lane .st { flex: none; font-size: 12px; color: var(--text-secondary); }
  .row { background: var(--surface-1); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 6px; font-size: 14px; }
  .row .id { color: var(--text-muted); margin-right: 6px; }
  pre.note { white-space: pre-wrap; font: 14px/1.45 ui-monospace, Menlo, monospace; background: var(--surface-1);
             border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 0; color: var(--text-secondary); }
  .foot { font-size: 12px; color: var(--text-muted); margin-top: 24px; white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; }
  .empty { color: var(--text-muted); padding: 4px; }
  .err { color: var(--critical-text); }
  .filters { display: flex; gap: 6px; margin: 0 4px 10px; min-height: 36px; }
  .filters button { border: 1px solid var(--line); background: var(--surface-1); color: var(--text-secondary);
                    border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; }
  .filters button[aria-pressed="true"] { background: var(--text-primary); color: var(--surface-1); border-color: var(--text-primary); }
  /* plan view: boxes in wave columns, arrows drawn over them on a wide screen, waves stacked on a phone */
  .planbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 0 4px 8px; flex-wrap: wrap; }
  .planbar .sub2 { margin: 0; }
  .plan { position: relative; display: flex; flex-direction: column; gap: 14px; margin-bottom: 8px; }
  .plan .wave { display: flex; flex-direction: column; gap: 8px; }
  .plan .wave > h5 { margin: 0; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
  .plan svg { display: none; position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .pbox { display: block; width: 100%; text-align: left; font: inherit; font-size: 13px; color: var(--text-primary); cursor: pointer;
          background: var(--surface-1); border: 1px solid var(--line); border-left: 4px solid var(--text-muted); border-radius: 10px; padding: 6px 9px; }
  .pbox .i { font-weight: 600; margin-right: 6px; }
  .pbox .t { color: var(--text-secondary); overflow-wrap: anywhere; }
  .pbox .m { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 3px; font-size: 12px; color: var(--text-muted); }
  .pbox .lk { border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; }
  .pbox .need { display: block; margin-top: 3px; font-size: 12px; color: var(--critical-text); overflow-wrap: anywhere; }
  .pbox.p-ready { border-left-color: var(--good); } .pbox.p-waits { border-left-color: var(--text-muted); }
  .pbox.p-doing { border-left-color: var(--accent); } .pbox.p-review { border-left-color: var(--warning); }
  .pbox.p-blocked { border-left-color: var(--critical); } .pbox.p-done { border-left-color: var(--good); opacity: .6; }
  .pbox.crit { box-shadow: 0 0 0 2px var(--text-primary); }
  .plan path { fill: none; stroke: var(--text-muted); stroke-width: 1.4; } .plan path.crit { stroke: var(--text-primary); stroke-width: 2.4; }
  .plan marker path { fill: var(--text-muted); stroke: none; }
  @media (min-width: 700px) {

      const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p.setAttribute("d", `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2 - 2},${y2}`);
      p.setAttribute("marker-end", "url(#parrow)");
      if (n.classList.contains("crit") && box.querySelector(`[data-pid="${d}"]`).classList.contains("crit")) p.setAttribute("class", "crit");
      svg.append(p);
    }
  });
  svg.setAttribute("width", box.scrollWidth); svg.setAttribute("height", box.scrollHeight);
}
function planView_(r) {
  const p = r.plan || { items: [], done_items: [] }, ns = "http://www.w3.org/2000/svg";
  if (!p.items.length) return el("p", { class: "empty" }, "No open items.");
  const cols = [];
  if (p.done_items.length) cols.push(el("div", { class: "wave" }, el("h5", {}, `Done · ${p.done}`),
    p.done_items.map(d => planBox({ ...d, state: "done", ready: false, locks: [], deps: [], critical: false }))));
  for (let w = 0; w < p.waves; w++) {
    const its = p.items.filter(x => x.wave === w);
    cols.push(el("div", { class: "wave" }, el("h5", {}, `Wave ${w}${w === 0 ? " · can start" : ""}`), its.map(planBox)));
  }
  const box = el("div", { class: "plan" }, ...cols);
  for (const x of p.items) {
    const n = box.querySelector(`[data-pid="${x.id}"]`);
    n.dataset.deps = [...x.done_deps, ...x.deps].join(",");
    if (x.deps.length || x.done_deps.length) n.querySelector(".m").append(el("span", {}, `after ${[...x.done_deps, ...x.deps].join(", ")}`));
  }
  const svg = document.createElementNS(ns, "svg");
  svg.innerHTML = '<defs><marker id="parrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8z"/></marker></defs>';
  box.append(svg);
  requestAnimationFrame(() => planArrows(box));
  box._redraw = () => { svg.querySelectorAll(":scope > path").forEach(x => x.remove()); planArrows(box); };
  return box;
}
window.addEventListener("resize", () => { const b = document.querySelector(".plan"); if (b && b._redraw) b._redraw(); });

function busy() {
  const a = document.activeElement;
  return palOpen || sheetStack.length || roomsOpen || Object.keys(armed).length || Object.keys(sending).length || inflight || pauseArmed
    || Date.now() - lastTouch < 2000 || (a && a.tagName === "TEXTAREA") || document.visibilityState !== "visible";
}
for (const ev of ["touchstart", "touchmove", "touchend", "pointerdown", "wheel", "keydown"])
  addEventListener(ev, () => { lastTouch = Date.now(); }, { passive: true, capture: true });

// The list changed shape while he is reading: say so, don't move anything.
function showPill() {
  const r = room(), p = $("newpill");
  if (!r) return;
  const { added, removed } = structDiff(r, shownStruct, structOf(r));
  p.textContent = added ? `↑ ${added} new card${added > 1 ? "s" : ""} · tap to show`
    : removed ? `↑ ${removed} card${removed > 1 ? "s" : ""} gone · tap to refresh` : "↑ the page changed · tap to show";
  p.hidden = false; pending = true;
}
$("newpill").addEventListener("click", () => { draw(true); });
addEventListener("scroll", () => { if (pending && window.scrollY <= 40 && !busy()) draw(); }, { passive: true });

// leadcmd:begin
function leadTerminal(lc, thread) {
  const t = (thread || "").trim();
  return lc.terminal.replace(/ THREAD_ID$/, " " + (t || "THREAD_ID"));
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (_) {}
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.append(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (_) {}
  ta.remove();
  return ok;
}
// leadcmd:end
// t3note:begin
function t3NoteText(st) {
  return st && st.t3 && st.t3.configured === false
    ? ["T3 is not installed or not linked, so atr will not act on anything you do here.",
       "Answers, pauses and notes are saved in your local files only. Nothing is sent to agents, and no agent starts or reacts, until T3 is installed and atr is linked to it (T3CODE_CLI_PATH)."]
    : null;
}
function showT3Note(st) {
  const n = $("t3note"), msg = t3NoteText(st);
  n.hidden = !msg;
  if (!msg) return n.replaceChildren();
  n.replaceChildren(el("b", {}, msg[0]), msg[1] + " ", el("a", { href: base + "doc?file=docs/SETUP.md" }, "Setup guide"));
}
// t3note:end
// stale:begin
// A background refresh failed after a good load: say the cards are old (outside #app, so a deferred redraw can't hide it).
let lastOk = null;
function staleText(at, now) {
  const same = at.toDateString() === now.toDateString();
  const t = at.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", ...(same ? {} : { timeZoneName: "short" }) });
  return `Can't reach the page's server. Showing data last loaded at ${same ? t : at.toLocaleDateString([], { month: "short", day: "numeric" }) + ", " + t}. Trying again automatically.`;
}
function setStale(failed) {
  const s = $("stale");
  s.hidden = !failed || !lastOk;
  if (!s.hidden) s.textContent = staleText(lastOk, new Date());
  document.body.classList.toggle("isstale", !s.hidden);
}
// stale:end

let loadSequence = 0;
async function load(force) {
  if (!force && busy()) {
    if (!retryTimer) retryTimer = setTimeout(() => { retryTimer = null; load(); }, 2500);
    return;
  }
  const rn = current;
  const requestId = ++loadSequence;
  try {
    if (overview) {
      try { const response = await fetch(base + "api/dashboard", {cache:"no-store"}); if (!response.ok) throw new Error(`HTTP ${response.status}`); dashboard = await response.json(); dashboardError = null; }
      catch (error) { dashboardError = `Dashboard refresh failed; retained observations may be stale: ${error}`; }
    }
    const cached = bodies[rn || ""], headers = cached && cached.tag ? { "If-None-Match": cached.tag } : {};
    const res = await fetch(base + "api/state" + (rn ? `?room=${encodeURIComponent(rn)}` : ""), { cache: "no-store", headers });
    let ns;
    if (res.status === 304 && cached) ns = stateRoom === rn && state ? state : JSON.parse(cached.text);
    else if (res.status === 404 && rn) { current = null; try { browserStore.removeItem("room"); browserStore.removeItem("view"); } catch (_) {} history.replaceState(null, "", location.pathname); return load(true); }   // unknown or renamed room: start over
    else if (!res.ok) throw new Error(`HTTP ${res.status}`);
    else {
      const text = await res.text();
      bodies[rn || ""] = { tag: res.headers.get("ETag"), text };
      ns = JSON.parse(text);
    }
    if (requestId !== loadSequence || rn !== current) return;
    lastOk = new Date(); setStale(false);
    for (const x of ns.rooms) if (x.records && Object.keys(x.records).length) recCache[x.name] = { ...(recCache[x.name] || {}), ...x.records };
    const { now, ...rest } = ns, sig = rn + JSON.stringify(rest);
    const same = drawn && sig === lastSig && rn === current;
    state = ns; stateRoom = rn; showT3Note(ns);
    if (same) return;                           // nothing changed: no redraw, nothing moves
    lastSig = sig;
    if (rn !== current) return;                 // the user switched rooms while this was in flight
    const r = room();
    const calm = !drawn || !r || window.scrollY <= 40;
    if (calm) draw();
    else {
      if (!structDiff(r, shownStruct, structOf(r)).changed) { if (!pending) draw(); }   // text only: redraw anchored
      else showPill();
    }
    if (current && stateRoom !== current) load(true);   // first visit: draw() just picked the room, fetch its records
  } catch (e) {
    if (!state) $("app").replaceChildren(el("p", { class: "err" }, `Can't reach the atr: ${e}`));
    else setStale(true);
  }
}
load(true).then(() => { if (params.get("open")) openRecord(params.get("open")); });
setInterval(load, 30000);
document.addEventListener("visibilitychange", () => load());
</script>
