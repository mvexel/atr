<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<title>atr</title>
<style>
  :root {
    --bg: #f3f2ef; --card: #fcfcfb; --line: #e3e2dd; --text: #0b0b0b; --text2: #52514e; --muted: #6b6a65;
    --accent: #1d63b8; --accent-ink: #fff; --good: #0a7a0a; --info: #1d63b8; --warn: #b87400; --warn-soft: #fdf3dc;
    --bad: #b52f2f; --track: #ecebe7; --mono: ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark; --bg: #121211; --card: #1a1a19; --line: #2e2e2c; --text: #f0efec; --text2: #c3c2b7; --muted: #9a9992;
      --accent: #2c6fcb; --good: #0ca30c; --info: #6aa6f2; --warn: #f0a92a; --warn-soft: #33290f; --bad: #ef6a6a; --track: #2a2a28; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  main { max-width: 920px; margin: 0 auto; padding: 16px 14px 80px; }
  a { color: var(--info); }
  h1 { font-size: 21px; margin: 0; overflow-wrap: anywhere; }
  .top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .top .sp { flex: 1; }
  .back, .link { border: 0; background: none; color: var(--info); font: inherit; cursor: pointer; padding: 0; text-decoration: underline; }
  .muted { color: var(--muted); } .small { font-size: 13px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .tile { text-align: left; font: inherit; color: inherit; border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--card); cursor: pointer; }
  .tile.needs { border-color: var(--warn); }
  .tile b { display: block; font-size: 16px; }
  .bar { height: 6px; border-radius: 3px; background: var(--track); margin: 10px 0 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--good); }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 8px; white-space: nowrap; background: var(--track); color: var(--text2); }
  .pill.you { background: var(--warn-soft); color: var(--text); border: 1px solid var(--warn); }
  .pill.added { background: none; border: 1px dashed var(--info); color: var(--text); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  .chip { font: inherit; font-size: 13px; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .banner { margin: 8px 0; padding: 9px 12px; border-radius: 10px; background: var(--track); font-size: 14px; }
  .banner ul { margin: 4px 0 0; padding-left: 18px; }
  .card { margin: 10px 0; padding: 14px; border-radius: 12px; background: var(--warn-soft); border: 1px solid var(--warn); }
  .card .k { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text2); }
  .card .q { font-weight: 650; margin: 4px 0; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
  button.b, select.b, .btns input, .form input, .form select { font: inherit; font-size: 14px; min-height: 36px; padding: 6px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  button.b { cursor: pointer; } button.b.p { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.b.d { color: var(--bad); }
  .btns input, .form input { flex: 1 1 160px; min-width: 0; }
  .form { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }

  details.goal { margin: 14px 0 0; border-left: 2px solid var(--line); padding-left: 12px; }
  details.goal > summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; padding: 4px 0; }
  details.goal > summary::-webkit-details-marker { display: none; }
  details.goal > summary::before { content: "▸"; color: var(--muted); width: 12px; flex: none; }
  details.goal[open] > summary::before { content: "▾"; }
  details.goal.proposed { border-left-style: dashed; }
  details.goal.over { border-left-color: var(--accent); }
  .id { font: 600 12px var(--mono); color: var(--muted); flex: none; }
  .gt { font-weight: 650; font-size: 16px; }
  .count { margin-left: auto; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .gbody { padding: 0 0 4px 20px; }
  .task { border: 1px solid var(--line); border-radius: 10px; background: var(--card); margin: 6px 0; }
  .task.new { border-style: dashed; border-color: var(--info); }
  .task.before { box-shadow: 0 -3px 0 var(--accent); }
  .row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; flex-wrap: wrap; min-height: 40px; }
  .grip { color: var(--muted); cursor: grab; user-select: none; letter-spacing: -2px; }
  @media (pointer: coarse) { .grip { display: none; } }
  .tt { flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere; }
  .task.s-done .tt, .task.s-dropped .tt, .task.s-parked .tt { color: var(--muted); }
  .task.s-dropped .tt { text-decoration: line-through; }
  .after { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .st { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; white-space: nowrap; }
  .st i { width: 9px; height: 9px; border-radius: 50%; }
  .st.done i { background: var(--good); } .st.doing i { background: var(--info); } .st.blocked i { background: var(--warn); }
  .st.todo i { border: 1.5px solid var(--muted); } .st.dropped i { background: var(--bad); } .st.parked i { background: var(--muted); }
  .body { border-top: 1px solid var(--line); padding: 10px 12px 12px; font-size: 14px; }
  .dec { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; margin: 8px 0; }
  .dec.to_review { border-left-color: var(--info); } .dec.needs_you { border-left-color: var(--warn); } .dec.overturned { border-left-color: var(--bad); }
  .dec dl { display: grid; grid-template-columns: 76px 1fr; gap: 2px 10px; margin: 4px 0; }
  .dec dt { color: var(--muted); } .dec dd { margin: 0; overflow-wrap: anywhere; }
  .docs { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .doc { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 8px; padding: 4px 10px; cursor: pointer; text-decoration: none; }
  h2 { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 22px 0 6px; }
  aside { position: fixed; top: 0; right: 0; bottom: 0; width: min(600px, 100%); background: var(--card); border-left: 1px solid var(--line); box-shadow: -8px 0 30px rgba(0,0,0,.25);
          z-index: 30; display: flex; flex-direction: column; }
  aside[hidden] { display: none; }
  aside header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  aside header b { flex: 1; overflow-wrap: anywhere; }
  aside .md { overflow-y: auto; padding: 4px 16px 40px; flex: 1; overflow-wrap: anywhere; }
  .md pre { background: var(--bg); padding: 10px; border-radius: 8px; overflow-x: auto; font: 13px var(--mono); }
  .md code { font: 13px var(--mono); background: var(--bg); padding: 1px 4px; border-radius: 4px; }
  .md h3 { font-size: 18px; } .md h4 { font-size: 16px; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px;
           z-index: 40; max-width: calc(100vw - 24px); font-size: 14px; }
  #toast[hidden] { display: none; }
</style>
</head>
<body>
<main id="app"></main>
<aside id="panel" hidden><header><b id="ptitle"></b><button class="b" id="pclose">Close</button></header><div class="md" id="pbody"></div></aside>
<div id="toast" hidden role="status"></div>
<script>
"use strict";
const LABEL = { todo: "To do", doing: "In progress", blocked: "Blocked", done: "Done", parked: "Parked", dropped: "Dropped" };
const S = { data: null, sig: "", filter: "all", open: new Set(), editing: null, dragging: null };
const app = document.getElementById("app");

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else if (k in e && k !== "list") e[k] = v;
    else e.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(kid));
  return e;
}
const mount = (parent, ...kids) => parent.replaceChildren(...h("div", {}, kids).childNodes);
const project = () => decodeURIComponent(location.hash.slice(1));
const collapsedKey = () => "atr:collapsed:" + project();
const collapsed = () => new Set(JSON.parse(localStorage.getItem(collapsedKey()) || "[]"));
function toast(text) {
  const t = document.getElementById("toast");
  t.textContent = text; t.hidden = false;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.hidden = true, 6000);
}
async function get(path) {
  const r = await fetch(path);
  const body = await r.json();
  if (!r.ok) throw new Error(body.error || r.statusText);
  return body;
}
async function act(op, args) {
  try {
    const r = await fetch("/api/p/" + encodeURIComponent(project()), { method: "POST", headers: { "Content-Type": "application/json", "X-Atr": "1" },
      body: JSON.stringify({ op, args, rev: S.data.plan.rev }) });
    const body = await r.json();
    if (!r.ok) toast(body.error || "That did not save.");
  } catch (e) { toast("Not saved: the atr server did not answer."); }
  S.editing = null;
  await load();
}

// ---- small pieces ----
const btn = (text, onclick, cls) => h("button", { class: "b " + (cls || ""), onclick: e => { e.stopPropagation(); onclick(e); } }, text);
const isNew = t => !t.agreed && !["parked", "dropped"].includes(t.status);
const status = s => h("span", { class: "st " + s }, h("i"), LABEL[s]);
function form(key, fields, save, saveLabel) {
  // An inline form; `key` keeps it open across redraws.
  const inputs = fields.map(f => f.options
    ? h("select", { "aria-label": f.label }, f.options.map(o => h("option", { value: o[0] }, o[1])))
    : h("input", { placeholder: f.label, "aria-label": f.label, value: f.value || "" }));
  const submit = () => save(...inputs.map(i => i.value.trim()));
  inputs.forEach(i => i.addEventListener("keydown", e => { if (e.key === "Enter") submit(); if (e.key === "Escape") { S.editing = null; draw(); } }));
  return h("div", { class: "form", onclick: e => e.stopPropagation() }, inputs, btn(saveLabel || "Save", submit, "p"),
    key && btn("Cancel", () => { S.editing = null; draw(); }));
}
const edit = key => () => { S.editing = key; draw(); };

function decision(d, plan) {
  const who = d.by === "you" ? "you" : "the lead, without asking";
  const state = { needs_you: "waiting on you", to_review: "not reviewed yet", accepted: "accepted", overturned: "overturned by you" }[d.state];
  const rows = [];
  const row = (k, v) => v && rows.push(h("dt", {}, k), h("dd", {}, v));
  row("Question", d.question); row("Chosen", d.chosen); row("Suggested", d.state === "needs_you" && d.recommended);
  row("Why", d.why); row("Rejected", (d.rejected || []).join(" · ")); row("Your note", d.note);
  return h("div", { class: "dec " + d.state },
    h("div", {}, h("b", {}, d.id), ` · decided by ${who} · ${d.undo} to undo · `, h("span", { class: "muted" }, state)),
    h("dl", {}, rows),
    d.state === "to_review" && h("div", { class: "btns" }, btn("Accept", () => act("review", { id: d.id, verdict: "accept" }), "p"),
      S.editing === "ov" + d.id ? form("ov" + d.id, [{ label: "Why, and what instead" }], note => act("review", { id: d.id, verdict: "overturn", note }), "Overturn")
        : btn("Overturn", edit("ov" + d.id))));
}
function docs(list) {
  return list.length ? h("div", { class: "docs" }, list.map(d => d.url
    ? h("a", { class: "doc", href: d.url, target: "_blank", rel: "noopener", onclick: e => e.stopPropagation() }, d.title + " ↗")
    : h("button", { class: "doc", onclick: e => { e.stopPropagation(); openDoc(d); } }, "📄 " + d.title))) : null;
}
function card(d) {
  const answer = choice => act("answer", { id: d.id, choice });
  return h("div", { class: "card" },
    h("div", { class: "k" }, `Waiting on you · ${d.id}` + (d.on !== "project" ? ` · blocks ${d.on}` : "")),
    h("div", { class: "q" }, d.question || d.recommended),
    d.why && h("div", {}, d.why),
    h("div", { class: "btns" }, d.options.map((o, i) => btn(o + (i === 0 ? " (suggested)" : ""), () => answer(o), i === 0 ? "p" : ""))),
    form(null, [{ label: "Or write your own answer" }], text => text && answer(text), "Answer"));
}

// ---- project view ----
function taskNode(t, plan) {
  const on = plan.decisions.filter(d => d.on === t.id), files = plan.docs.filter(d => d.on === t.id);
  const pruned = t.status === "parked" || t.status === "dropped";
  const node = h("div", { class: `task s-${t.status}` + (isNew(t) ? " new" : ""), "data-id": t.id, draggable: !pruned && matchMedia("(pointer: fine)").matches });
  const marks = on.filter(d => d.state !== "accepted").map(d => h("span", { class: "pill" + (d.state === "needs_you" ? " you" : "") },
    d.id + ({ needs_you: " needs you", to_review: " to review", overturned: " overturned" }[d.state])));
  node.append(h("div", { class: "row", onclick: () => { S.open.has(t.id) ? S.open.delete(t.id) : S.open.add(t.id); draw(); } },
    h("span", { class: "grip", title: "Drag to reorder or move to another goal" }, "⋮⋮"), h("span", { class: "id" }, t.id), h("span", { class: "tt" }, t.title),
    isNew(t) && h("span", { class: "pill added" }, "+ new from agent"),
    t.after.length ? h("span", { class: "after" }, "after " + t.after.join(", ")) : null, marks,
    files.length ? h("span", { class: "after" }, `📄 ${files.length}`) : null,
    pruned && t.stopped === false ? h("span", { class: "pill you" }, "lead has not stopped it yet") : null,
    status(t.status)));
  if (!S.open.has(t.id)) return node;
  const others = plan.tasks.filter(o => o.id !== t.id && !t.after.includes(o.id) && !["parked", "dropped"].includes(o.status));
  node.append(h("div", { class: "body" },
    S.editing === "tt" + t.id ? form("tt" + t.id, [{ label: "Title", value: t.title }], title => act("task_set", { id: t.id, title })) : null,
    t.note && h("div", {}, t.note),
    (t.owner || t.thread) && h("div", { class: "muted small" }, t.owner && `Worker: ${t.owner} `, t.thread && h("a", { href: t.thread, target: "_blank", rel: "noopener" }, "Open thread ↗")),
    on.map(d => decision(d, plan)), docs(files),
    h("div", { class: "btns" },
      t.after.map(a => btn(`after ${a} ✕`, () => act("dep", { id: t.id, other: a, remove: true }))),
      !pruned && others.length ? h("select", { class: "b", "aria-label": "Add a dependency", onclick: e => e.stopPropagation(),
        onchange: e => e.target.value && act("dep", { id: t.id, other: e.target.value }) },
        h("option", { value: "" }, "+ comes after…"), others.map(o => h("option", { value: o.id }, `${o.id} ${o.title}`))) : null),
    S.editing === "dc" + t.id ? form("dc" + t.id, [{ label: "What you decided" }, { label: "What you ruled out (optional)" }],
      (chosen, rejected) => act("decide", { on: t.id, chosen, rejected: rejected ? [rejected] : [] }), "Record") : null,
    h("div", { class: "btns" },
      pruned ? btn("Restore", () => act("task_restore", { id: t.id })) : [btn("Rename", edit("tt" + t.id)), btn("Record a decision", edit("dc" + t.id)),
        btn("Park", () => act("task_prune", { id: t.id, mode: "park" })), btn("Drop", () => act("task_prune", { id: t.id, mode: "drop" }), "d")])));
  return node;
}

function goalNode(g, plan, tasks) {
  const live = tasks.filter(t => !["parked", "dropped"].includes(t.status));
  const done = live.filter(t => t.status === "done").length, added = live.filter(isNew).length;
  const on = plan.decisions.filter(d => d.on === g.id), files = plan.docs.filter(d => d.on === g.id);
  const needs = plan.decisions.filter(d => d.state === "needs_you" && (d.on === g.id || tasks.some(t => t.id === d.on))).length;
  const shown = tasks.filter(t => S.filter === "all" || t.status === S.filter);
  const node = h("details", { class: "goal" + (g.proposed ? " proposed" : ""), open: !collapsed().has(g.id), "data-goal": g.id });
  node.addEventListener("toggle", () => {
    const c = collapsed(); node.open ? c.delete(g.id) : c.add(g.id);
    localStorage.setItem(collapsedKey(), JSON.stringify([...c]));
  });
  node.append(h("summary", {}, h("span", { class: "id" }, g.id), h("span", { class: "gt" }, g.title),
    g.proposed && h("span", { class: "pill you" }, "proposed by the lead"), needs ? h("span", { class: "pill you" }, `${needs} waiting on you`) : null,
    h("span", { class: "count" }, `${done} of ${live.length} done` + (added ? ` · ${added} new from agents` : ""))));
  node.append(h("div", { class: "gbody" },
    S.editing === "g" + g.id
      ? form("g" + g.id, [{ label: "Goal", value: g.title }, { label: "Done when…", value: g.done_when }], (title, done_when) => act("goal_edit", { id: g.id, title, done_when }))
      : h("div", { class: "muted small" }, g.done_when ? "Done when: " + g.done_when + " " : "No done test yet. ", h("button", { class: "link", onclick: edit("g" + g.id) }, "Edit"),
          !tasks.length && !g.proposed ? [" · ", h("button", { class: "link", onclick: () => act("goal_remove", { id: g.id }) }, "Remove")] : null),
    on.map(d => decision(d, plan)), docs(files),
    shown.map(t => taskNode(t, plan)),
    !g.proposed && S.filter === "all" ? form(null, [{ label: "Add a task to " + g.id }], title => title && act("task_add", { goal: g.id, title }), "Add") : null));
  return node;
}

function drawProject() {
  const { plan, unread } = S.data;
  const waiting = plan.decisions.filter(d => d.state === "needs_you"), proposed = plan.goals.filter(g => g.proposed);
  const review = plan.decisions.filter(d => d.state === "to_review");
  const unstopped = plan.tasks.filter(t => t.pruned_by && t.stopped === false);
  const gone = plan.tasks.filter(t => ["parked", "dropped"].includes(t.status) && t.stopped !== false);
  const fresh = plan.tasks.filter(isNew).length;
  const general = plan.decisions.filter(d => d.on === "project" && d.state !== "needs_you"), gdocs = plan.docs.filter(d => d.on === "project");
  document.title = (waiting.length + proposed.length ? `(${waiting.length + proposed.length}) ` : "") + plan.title + " · atr";
  mount(app, 
    h("div", { class: "top" }, h("button", { class: "back", onclick: () => location.hash = "" }, "← All projects"), h("span", { class: "sp" }),
      plan.lead.thread && h("a", { href: plan.lead.thread, target: "_blank", rel: "noopener" }, "Lead thread ↗")),
    h("h1", {}, plan.title),
    h("div", { class: "chips" }, ["all", "doing", "blocked", "todo", "done"].map(f =>
      h("button", { class: "chip", "aria-pressed": String(S.filter === f), onclick: () => { S.filter = f; draw(); } }, f === "all" ? "All" : LABEL[f]))),
    unread.length ? h("div", { class: "banner" }, `The lead has not read your ${unread.length} change${unread.length > 1 ? "s" : ""} yet. It picks them up on its next turn; nudge it in its thread if it is idle.`,
      h("ul", {}, unread.slice(-5).map(c => h("li", {}, c.what)))) : null,
    unstopped.length ? h("div", { class: "banner" }, "Waiting for the lead to stop work on " + unstopped.map(t => t.id).join(", ") + ".") : null,
    waiting.map(card),
    proposed.map(g => h("div", { class: "card" }, h("div", { class: "k" }, `The lead proposes a goal · ${g.id}`), h("div", { class: "q" }, g.title),
      g.done_when && h("div", {}, "Done when: " + g.done_when),
      h("div", { class: "btns" }, btn("Accept goal", () => act("goal_accept", { id: g.id }), "p"), btn("Reject", () => act("goal_remove", { id: g.id }))))),
    review.length ? h("div", { class: "banner" }, h("button", { class: "link", onclick: () => { review.forEach(d => S.open.add(d.on)); draw(); } },
      `${review.length} agent call${review.length > 1 ? "s" : ""} to review`), " — choices the lead made without asking.") : null,
    fresh ? h("div", { class: "banner" }, `${fresh} task${fresh > 1 ? "s" : ""} added by agents since you last agreed the plan (marked "new"). Drop what you do not want, then `,
      h("button", { class: "link", onclick: () => act("agree", {}) }, "agree the plan as it stands"), ".") : null,
    general.length || gdocs.length ? [h("h2", {}, "Whole project"), general.map(d => decision(d, plan)), docs(gdocs)] : null,
    plan.goals.map(g => goalNode(g, plan, plan.tasks.filter(t => t.goal === g.id && !gone.includes(t)))),
    plan.goals.length ? null : h("p", { class: "muted" }, "No goals yet. Goals are yours: add the first one below, then the lead can add tasks under it."),
    h("h2", {}, "Add a goal"),
    form(null, [{ label: "Goal, in one line" }, { label: "Done when…" }], (title, done_when) => title && act("goal_add", { title, done_when }), "Add goal"),
    gone.length ? h("details", { class: "goal" }, h("summary", {}, h("span", { class: "gt" }, "Parked and dropped"), h("span", { class: "count" }, String(gone.length))),
      h("div", { class: "gbody" }, gone.map(t => taskNode(t, plan)))) : null);
}

// ---- drag to rearrange ----
const clearMarks = () => document.querySelectorAll(".before, .over").forEach(e => e.classList.remove("before", "over"));
app.addEventListener("dragstart", e => { const t = e.target.closest?.(".task"); if (t) { S.dragging = t.dataset.id; e.dataTransfer.effectAllowed = "move"; } });
app.addEventListener("dragover", e => {
  if (!S.dragging) return;
  const task = e.target.closest(".task"), goal = e.target.closest("details[data-goal]");
  if (!goal || goal.classList.contains("proposed")) return;
  e.preventDefault(); clearMarks();
  (task && task.dataset.id !== S.dragging ? task : goal).classList.add(task && task.dataset.id !== S.dragging ? "before" : "over");
});
app.addEventListener("drop", e => {
  const task = e.target.closest(".task"), goal = e.target.closest("details[data-goal]"), id = S.dragging;
  S.dragging = null; clearMarks();
  if (!id || !goal) return;
  e.preventDefault();
  act("task_move", { id, goal: goal.dataset.goal, before: task && task.dataset.id !== id ? task.dataset.id : null });
});
app.addEventListener("dragend", () => { S.dragging = null; clearMarks(); });

// ---- documents ----
function inline(text) {
  const out = [], re = /(`[^`]+`|\*\*[^*]+\*\*|\[[^\]]+\]\(https?:\/\/[^)\s]+\))/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    out.push(text.slice(last, m.index)); last = re.lastIndex;
    const s = m[0];
    if (s[0] === "`") out.push(h("code", {}, s.slice(1, -1)));
    else if (s[0] === "*") out.push(h("b", {}, s.slice(2, -2)));
    else { const [, label, url] = s.match(/^\[([^\]]+)\]\((.+)\)$/); out.push(h("a", { href: url, target: "_blank", rel: "noopener" }, label)); }
  }
  out.push(text.slice(last));
  return out;
}
function markdown(text) {
  const out = []; let para = [], list = null, code = null;
  const flush = () => { if (para.length) out.push(h("p", {}, inline(para.join(" ")))); para = []; list = null; };
  for (const line of text.split("\n")) {
    if (code) { if (line.startsWith("```")) { out.push(h("pre", {}, code.join("\n"))); code = null; } else code.push(line); continue; }
    if (line.startsWith("```")) { flush(); code = []; continue; }
    const head = line.match(/^(#{1,6})\s+(.*)/), item = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
    if (head) { flush(); out.push(h(head[1].length < 3 ? "h3" : "h4", {}, inline(head[2]))); }
    else if (item) { if (!list) { flush(); list = h("ul"); out.push(list); } list.append(h("li", {}, inline(item[1]))); }
    else if (!line.trim()) flush();
    else { list = null; para.push(line); }
  }
  if (code) out.push(h("pre", {}, code.join("\n")));
  flush();
  return out;
}
async function openDoc(d) {
  const panel = document.getElementById("panel");
  document.getElementById("ptitle").textContent = d.title;
  document.getElementById("pbody").replaceChildren(h("p", { class: "muted" }, "Loading…"));
  panel.hidden = false;
  try {
    const doc = await get(`/api/doc/${encodeURIComponent(project())}/${d.id}`);
    document.getElementById("pbody").replaceChildren(...(doc.binary ? [h("p", { class: "muted" }, "This file is not text, so it cannot be shown here.")]
      : /\.(md|markdown|txt)$/i.test(d.file) ? markdown(doc.text) : [h("pre", {}, doc.text)]));
  } catch (e) { document.getElementById("pbody").replaceChildren(h("p", {}, e.message)); }
}
document.getElementById("pclose").onclick = () => document.getElementById("panel").hidden = true;
addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("panel").hidden = true; });

// ---- loading ----
async function drawProjects() {
  const list = await get("/api/projects");
  document.title = "atr";
  list.sort((a, b) => (b.needs_you > 0) - (a.needs_you > 0) || b.to_review - a.to_review || a.title.localeCompare(b.title));
  mount(app, h("div", { class: "top" }, h("h1", {}, "Projects")),
    list.length ? h("div", { class: "tiles" }, list.map(p => h("button", { class: "tile" + (p.needs_you ? " needs" : ""), onclick: () => location.hash = p.name },
      h("b", {}, p.title), h("span", { class: "muted small" }, `${p.goals} goals · ${p.tasks} tasks · ${p.running} running`),
      h("div", { class: "bar" }, h("i", { style: `width:${p.tasks ? Math.round(100 * p.done / p.tasks) : 0}%` })),
      p.needs_you ? h("span", { class: "pill you" }, `${p.needs_you} waiting on you`)
        : h("span", { class: "muted small" }, p.to_review ? `${p.to_review} agent calls to review` : "Nothing needs you"),
      p.unread ? h("div", { class: "muted small" }, `Lead has not read ${p.unread} of your changes`) : null)))
    : h("p", { class: "muted" }, "No projects yet. In a repo, run: atr init my-project \"My project\""));
}
function draw() {
  const y = scrollY;
  drawProject();
  scrollTo(0, y);
  app.querySelector(".form input[value]:not([value=''])")?.focus();
}
async function load() {
  try {
    if (!project()) { S.data = null; return await drawProjects(); }
    S.data = await get("/api/p/" + encodeURIComponent(project()));
    S.sig = S.data.sig;
    draw();
  } catch (e) { mount(app, h("p", {}, e.message), h("button", { class: "back", onclick: () => location.hash = "" }, "← All projects")); }
}
const typing = () => ["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement?.tagName) && document.activeElement.value !== "";
setInterval(async () => {
  if (document.hidden || typing() || S.dragging) return;
  try {
    const sigs = await get("/api/sig");
    if (!project()) { const all = JSON.stringify(sigs); if (all !== S.all) { S.all = all; drawProjects(); } }
    else if (sigs[project()] && sigs[project()] !== S.sig) load();
  } catch (e) { /* server away; keep what is on screen */ }
}, 3000);
addEventListener("hashchange", () => { S.open.clear(); S.filter = "all"; S.editing = null; load(); });
load();
</script>
