[project]
name = "atr"
version = "0.4.14"
description = "A goal tree, tasks and decisions for a team of coding agents, on one page you can touch."
readme = "README.md"
license = "FSL-1.1-ALv2"
license-files = ["LICENSE.md"]
authors = [
    { name = "Martijn van Exel", email = "m@rtijn.org" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
atr = "atr:main"

[build-system]
requires = ["uv_build>=0.13.2,<0.14.0"]
build-backend = "uv_build"
